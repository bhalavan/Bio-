<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Balavan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --blue-deep: #0b1f6b;
    --blue: #1a3fd1;
    --blue-glow: #5b83ff;
    --blue-ice: #dfe6ff;
    --smoke: #aab2c0;
    --smoke-dim: #8b93a3;
    --text: #e8ebf2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--black); }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--black);
    color: var(--text);
    font-family: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Background: smoke + live chart ---------- */
  .smoke {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .smoke i {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    will-change: transform;
  }
  .smoke i:nth-child(1) {
    width: 90vmax; height: 90vmax; left: -30vmax; top: -35vmax;
    background: radial-gradient(circle, rgba(170,178,192,.18), transparent 62%);
    animation: drift-a 34s ease-in-out infinite alternate;
  }
  .smoke i:nth-child(2) {
    width: 80vmax; height: 80vmax; right: -35vmax; top: 15vmax;
    background: radial-gradient(circle, rgba(140,150,170,.14), transparent 62%);
    animation: drift-b 41s ease-in-out infinite alternate;
  }
  .smoke i:nth-child(3) {
    width: 70vmax; height: 70vmax; left: 10vmax; bottom: -40vmax;
    background: radial-gradient(circle, rgba(26,63,209,.30), transparent 65%);
    animation: drift-a 38s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift-a { to { transform: translate3d(12vmax, 8vmax, 0) scale(1.15); } }
  @keyframes drift-b { to { transform: translate3d(-14vmax, -6vmax, 0) scale(1.1); } }

  #chart {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: .2;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    padding: 64px 20px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Profile ring ---------- */
  .avatar {
    position: relative;
    width: 152px;
    height: 152px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font: inherit;
    color: inherit;
  }
  .avatar:focus-visible { outline: 2px solid var(--blue-glow); outline-offset: 6px; }

  .avatar .glow {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(26,63,209,0) 0deg,
      var(--blue) 200deg,
      var(--blue-glow) 290deg,
      rgba(26,63,209,0) 345deg);
    filter: blur(16px);
    opacity: .5;
    animation: spin 3.6s linear infinite;
  }

  /* Dashed ring: a fixed dash mask with a light that travels underneath it */
  .avatar .dashes {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(139,147,163,.28);
    -webkit-mask: repeating-conic-gradient(#000 0deg 6deg, transparent 6deg 10deg);
    mask: repeating-conic-gradient(#000 0deg 6deg, transparent 6deg 10deg);
    overflow: hidden;
  }
  .avatar .light,
  .avatar .flash {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  .avatar .light {
    background: conic-gradient(from 0deg,
      rgba(26,63,209,0) 0deg,
      rgba(26,63,209,.35) 90deg,
      var(--blue) 190deg,
      var(--blue-glow) 260deg,
      #ffffff 322deg,
      rgba(26,63,209,0) 350deg);
    animation: spin 3.6s linear infinite;
  }
  /* faster bright sweep that plays on tap, like a story being opened */
  .avatar .flash {
    opacity: 0;
    background: conic-gradient(from 0deg,
      rgba(255,255,255,0) 0deg,
      var(--blue-glow) 120deg,
      #ffffff 200deg,
      var(--blue-glow) 260deg,
      rgba(255,255,255,0) 340deg);
  }
  .avatar .ripple {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed var(--blue-glow);
    opacity: 0;
    pointer-events: none;
  }
  .avatar .gap {
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--black);
  }
  .avatar .face {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 30% 22%, #2b52e6 0%, var(--blue-deep) 58%, #040a24 100%);
  }
  .avatar .face img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .avatar.burst .flash  { animation: flash 1.4s cubic-bezier(.2,.7,.2,1); }
  .avatar.burst .ripple { animation: ripple 1.1s ease-out; }
  .avatar.burst .face   { animation: press .55s ease-out; }

  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes flash  {
    0%   { opacity: 0; transform: rotate(0deg); }
    12%  { opacity: 1; }
    100% { opacity: 0; transform: rotate(600deg); }
  }
  @keyframes ripple {
    0%   { opacity: .85; transform: scale(1); }
    100% { opacity: 0;   transform: scale(1.5); }
  }
  @keyframes press {
    0%   { transform: scale(1); }
    30%  { transform: scale(.94); }
    100% { transform: scale(1); }
  }

  /* ---------- Identity ---------- */
  h1 {
    margin: 32px 0 0;
    font-family: "Unbounded", "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.1;
    text-shadow: 0 2px 18px #000;
  }
  .bio {
    margin: 14px 0 0;
    text-align: center;
    color: var(--smoke);
    font-size: 1.05rem;
    line-height: 1.55;
    text-shadow: 0 1px 14px #000;
  }

  /* ---------- Links ---------- */
  .links {
    list-style: none;
    margin: 36px 0 0;
    padding: 0;
    width: 100%;
    display: grid;
    gap: 12px;
  }
  .links a {
    display: block;
    padding: 17px 24px;
    border-radius: 999px;
    border: 1px solid rgba(170,178,192,.24);
    background: linear-gradient(180deg, rgba(170,178,192,.11), rgba(170,178,192,.04));
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--text);
    text-align: center;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .links a:hover {
    transform: translateY(-2px);
    border-color: rgba(91,131,255,.75);
    background: linear-gradient(180deg, rgba(26,63,209,.6), rgba(11,31,107,.6));
  }
  .links a:active { transform: translateY(0) scale(.99); }
  .links a:focus-visible { outline: 2px solid var(--blue-glow); outline-offset: 3px; }
  .links .sub { display: block; margin-top: 2px; font-size: .82rem; font-weight: 400; color: var(--smoke-dim); }
  .links a:hover .sub { color: var(--smoke); }
  .links .break { margin-top: 14px; }

  .promo-link { position: relative; padding-bottom: 14px; }
  .code-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 10px auto 0;
    padding: 6px 16px;
    width: max-content;
    max-width: 100%;
    border-radius: 999px;
    border: 1px dashed rgba(91,131,255,.65);
    background: rgba(26,63,209,.16);
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--blue-ice);
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .code-chip:hover { background: rgba(26,63,209,.3); border-color: var(--blue-glow); }
  .code-chip:active { transform: scale(.97); }
  .code-chip b { color: #fff; letter-spacing: .06em; }
  .code-chip-copied { display: none; }
  .code-chip.copied .code-chip-text { display: none; }
  .code-chip.copied .code-chip-copied { display: inline; }
  .code-chip.copied { background: rgba(26,63,209,.45); border-color: var(--blue-glow); }

  @media (prefers-reduced-motion: reduce) {
    .smoke i, .avatar .light, .avatar .glow { animation: none; }
    .avatar.burst .flash, .avatar.burst .ripple, .avatar.burst .face { animation: none; }
    .links a { transition: none; }
  }
</style>
</head>

    /* Background: a live candlestick chart that keeps climbing */
    (function () {
      var cv = document.getElementById('chart');
      var ctx = cv.getContext('2d');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var W = 0, H = 0, lastW = 0;
      var STEP = 20, BODY = 10, INTERVAL = 1100;
      var candles = [], live = null, price = 100;
      var vMin = 90, vMax = 110;

      function rnd(a, b) { return a + Math.random() * (b - a); }

      function makeCandle(open) {
        var r = (Math.random() + Math.random() + Math.random() - 1.5) * 1.8;
        if (Math.random() < 0.18) r -= rnd(1, 2);
        if (Math.random() < 0.08) r += rnd(1.5, 2.5);
        var close = open + 0.55 + r;
        return {
          o: open,
          c: close,
          h: Math.max(open, close) + rnd(0.2, 1.4),
          l: Math.min(open, close) - rnd(0.2, 1.4)
        };
      }

      function startLive() {
        live = { full: makeCandle(price), t0: performance.now() };
      }

      function seed() {
        candles = [];
        price = 100;
        var n = Math.ceil(W / STEP) + 6;
        for (var i = 0; i < n; i++) {
          var c = makeCandle(price);
          candles.push(c);
          price = c.c;
        }
        startLive();
        var lo = Infinity, hi = -Infinity;
        candles.forEach(function (c) { lo = Math.min(lo, c.l); hi = Math.max(hi, c.h); });
        vMin = lo; vMax = hi;
      }

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (W !== lastW) { lastW = W; seed(); }
        if (reduce) draw(performance.now());
      }

      function currentLive(p) {
        var f = live.full;
        var e = p * p * (3 - 2 * p);
        var c = f.o + (f.c - f.o) * e + Math.sin(performance.now() / 90) * 0.25 * (1 - p * 0.5);
        return {
          o: f.o,
          c: c,
          h: Math.max(f.o, c, f.o + (f.h - f.o) * p),
          l: Math.min(f.o, c, f.o - (f.o - f.l) * p)
        };
      }

      function draw(now) {
        var p = reduce ? 0.6 : Math.min(1, (now - live.t0) / INTERVAL);
        var cur = currentLive(p);
        var all = candles.concat([cur]);
        var rightX = W - 24;

        // fit the view to what is on screen, eased so it glides
        var lo = Infinity, hi = -Infinity;
        for (var i = 0; i < all.length; i++) {
          var k = all.length - 1 - i;
          var x = rightX - k * STEP - p * STEP;
          if (x < -STEP) continue;
          lo = Math.min(lo, all[i].l);
          hi = Math.max(hi, all[i].h);
        }
        var pad = (hi - lo) * 0.08;
        vMin += (lo - pad - vMin) * 0.06;
        vMax += (hi + pad - vMax) * 0.06;

        function Y(v) { return H * 0.10 + (1 - (v - vMin) / (vMax - vMin)) * H * 0.80; }

        ctx.clearRect(0, 0, W, H);

        // grid
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(170,178,192,.35)';
        for (var g = 1; g <= 5; g++) {
          var gy = Math.round(H * g / 6) + 0.5;
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
        }

        // price line, smoothed
        var pts = [];
        for (var j = 0; j < all.length; j++) {
          var kk = all.length - 1 - j;
          var px = rightX - kk * STEP - p * STEP;
          if (px < -STEP) continue;
          pts.push({ x: px, y: Y(all[j].c) });
        }
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (var s = 1; s < pts.length - 1; s++) {
          var mx = (pts[s].x + pts[s + 1].x) / 2, my = (pts[s].y + pts[s + 1].y) / 2;
          ctx.quadraticCurveTo(pts[s].x, pts[s].y, mx, my);
        }
        ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
        ctx.strokeStyle = 'rgba(120,155,255,1)';
        ctx.lineWidth = 1.8;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(70,110,255,1)';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.restore();

        // live price marker
        var lx = rightX - p * STEP, ly = Y(cur.c);
        ctx.save();
        ctx.setLineDash([4, 7]);
        ctx.strokeStyle = 'rgba(159,180,255,.9)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#dfe6ff';
        ctx.shadowColor = 'rgba(91,131,255,1)';
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function loop() {
        var now = performance.now();
        if (now - live.t0 >= INTERVAL) {
          candles.push(live.full);
          candles.shift();
          price = live.full.c;
          startLive();
          now = live.t0;
        }
        draw(now);
        requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resize);
      resize();
      if (!reduce) requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
